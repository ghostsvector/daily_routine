name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # daily_routine_sdk is a private repo, fetched over SSH via a
      # read-only deploy key (see pubspec.yaml).
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SDK_DEPLOY_KEY }}
      - run: mkdir -p ~/.ssh && ssh-keyscan github.com >> ~/.ssh/known_hosts

      - run: flutter pub get

      - run: flutter analyze

      - name: Check formatting (non-blocking)
        run: dart format --output=none --set-exit-if-changed .
        continue-on-error: true

      - name: Run tests
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No test/ directory, skipping."
          fi
