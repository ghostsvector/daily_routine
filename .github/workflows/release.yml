name: Release

# Cut a release: bump `version:` in pubspec.yaml (e.g. 1.1.0+2), merge to
# main, then push a matching tag (the part before "+"):
#   git tag v1.1.0 && git push origin v1.1.0
#
# Builds an Android release APK and a Linux .deb, and attaches both to a
# GitHub Release for that tag.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 (full history + tags) — actions/checkout's default
      # shallow (depth-1) clone doesn't fetch the tag ref in a way `gh
      # release create` recognizes, causing a spurious "tag exists locally
      # but has not been pushed" error even though the tag triggered this
      # exact run.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Verify tag matches pubspec.yaml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PUBSPEC_VERSION="$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)"
          if [ "$TAG_VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec.yaml version ($PUBSPEC_VERSION)."
            exit 1
          fi

      - name: Write .env from repository secrets
        run: |
          cat > .env <<EOF
          FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_WEB_API_KEY=${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_APP_ID=${{ secrets.FIREBASE_WEB_APP_ID }}
          FIREBASE_WEB_AUTH_DOMAIN=${{ secrets.FIREBASE_WEB_AUTH_DOMAIN }}
          FIREBASE_WEB_MEASUREMENT_ID=${{ secrets.FIREBASE_WEB_MEASUREMENT_ID }}
          FIREBASE_ANDROID_API_KEY=${{ secrets.FIREBASE_ANDROID_API_KEY }}
          FIREBASE_ANDROID_APP_ID=${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_IOS_API_KEY=${{ secrets.FIREBASE_IOS_API_KEY }}
          FIREBASE_IOS_APP_ID=${{ secrets.FIREBASE_IOS_APP_ID }}
          FIREBASE_BUNDLE_ID=${{ secrets.FIREBASE_BUNDLE_ID }}
          FIREBASE_MACOS_API_KEY=${{ secrets.FIREBASE_MACOS_API_KEY }}
          FIREBASE_MACOS_APP_ID=${{ secrets.FIREBASE_MACOS_APP_ID }}
          FIREBASE_WINDOWS_API_KEY=${{ secrets.FIREBASE_WINDOWS_API_KEY }}
          FIREBASE_WINDOWS_APP_ID=${{ secrets.FIREBASE_WINDOWS_APP_ID }}
          FIREBASE_WINDOWS_AUTH_DOMAIN=${{ secrets.FIREBASE_WINDOWS_AUTH_DOMAIN }}
          FIREBASE_WINDOWS_MEASUREMENT_ID=${{ secrets.FIREBASE_WINDOWS_MEASUREMENT_ID }}
          FIREBASE_LINUX_API_KEY=${{ secrets.FIREBASE_LINUX_API_KEY }}
          FIREBASE_LINUX_APP_ID=${{ secrets.FIREBASE_LINUX_APP_ID }}
          FIREBASE_LINUX_AUTH_DOMAIN=${{ secrets.FIREBASE_LINUX_AUTH_DOMAIN }}
          FIREBASE_LINUX_MEASUREMENT_ID=${{ secrets.FIREBASE_LINUX_MEASUREMENT_ID }}
          EOF

      # pubspec.yaml also lists .env.local as an asset — an empty file
      # satisfies the "asset must exist" check (it's an optional local
      # override, nothing needs to be in it for a release build).
      - run: touch .env.local

      # daily_routine_sdk is a private repo, fetched over SSH via a
      # read-only deploy key (see pubspec.yaml).
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SDK_DEPLOY_KEY }}
      - run: mkdir -p ~/.ssh && ssh-keyscan github.com >> ~/.ssh/known_hosts

      - run: flutter pub get

      - run: flutter analyze

      - name: Build Android release APK
        run: flutter build apk --release --dart-define=FLAVOR=external

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev dpkg-dev libsecret-1-dev

      - name: Build Linux .deb
        run: ./install_deb.sh

      - name: Rename artifacts with version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk \
            "release-artifacts/daily-routine-${VERSION}.apk"
          cp dist/*.deb "release-artifacts/daily-routine-${VERSION}_amd64.deb"

      # Proves a downloaded file is exactly what this workflow built —
      # checksums catch corruption/mismatches, the GPG signature also
      # proves it was actually built and released by this repo's own CI,
      # not tampered with or re-uploaded by someone else. See
      # release-signing-key.asc (repo root) for the public key to verify
      # against, and the README's "Verifying a release" section.
      - name: Generate checksums
        working-directory: release-artifacts
        run: sha256sum * > SHA256SUMS

      - name: Import GPG release signing key
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          echo "${{ secrets.GPG_PASSPHRASE }}" > /tmp/gpg-passphrase.txt

      - name: Sign artifacts and checksums
        working-directory: release-artifacts
        run: |
          for f in daily-routine-*.apk daily-routine-*.deb SHA256SUMS; do
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase-file /tmp/gpg-passphrase.txt \
              --detach-sign --armor "$f"
          done
          shred -u /tmp/gpg-passphrase.txt

      # This repo pushes straight to main instead of merging PRs, so `gh
      # release create --generate-notes` (which summarizes merged PRs) has
      # nothing to list and produces an almost-empty body — just a compare
      # link. Real "what changed" content only exists in commit messages,
      # so build the notes from `git log` between the previous tag and this
      # one instead.
      - name: Build release notes from commit history
        run: |
          PREV_TAG="$(git tag --sort=v:refname | grep -B1 -x "$GITHUB_REF_NAME" | head -1)"
          if [ "$PREV_TAG" = "$GITHUB_REF_NAME" ]; then
            git log --reverse --pretty=format:'- %s' "$GITHUB_REF_NAME" > /tmp/release-notes.md
          else
            git log --reverse --pretty=format:'- %s' "$PREV_TAG".."$GITHUB_REF_NAME" > /tmp/release-notes.md
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/release-notes.md \
            release-artifacts/*

      # Prepends the same commit-history notes to a CHANGELOG.md committed
      # to the repo, so "what changed" is written once, automatically,
      # right here — not by hand in a commit message after the fact.
      - name: Update CHANGELOG.md
        run: |
          DATE="$(date -u +%Y-%m-%d)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main

          {
            echo "## $GITHUB_REF_NAME — $DATE"
            echo ""
            cat /tmp/release-notes.md
            echo ""
            echo ""
            if [ -f CHANGELOG.md ]; then cat CHANGELOG.md; fi
          } > /tmp/CHANGELOG.new
          mv /tmp/CHANGELOG.new CHANGELOG.md

          git add CHANGELOG.md
          git commit -m "Update CHANGELOG.md for $GITHUB_REF_NAME [skip ci]"
          git push origin main
